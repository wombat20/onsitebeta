<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ONSITE BETA · 마스터 관리자</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="fonts/wanted-sans/WantedSansVariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
  --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;--line:#ECEEF3;--line2:#DFE3EB;
  --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
  --ok:#1F9254;--warn:#B8740F;--err:#E5383B;--err-weak:#FDF1F1;--warn-weak:#FDF6EA;--ok-weak:#EAF6EF;
  --r:10px;--r-sm:6px;--sh-pop:0 12px 32px -8px rgba(15,30,69,.18),0 2px 6px rgba(15,30,69,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Wanted Sans Variable","Wanted Sans",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;color:var(--tx);background:#fff;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit;}
button{cursor:pointer;background:none;border:0;}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
svg.i.s14{width:14px;height:14px;}

/* 레이아웃 */
.app{display:flex;min-height:100vh;}
.nav{width:240px;flex-shrink:0;background:var(--bg-sub);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.nav-logo{height:60px;display:flex;align-items:center;padding:0 20px;}
.nav-logo .logo-svg{height:26px;width:auto;display:block;}
.nav-body{flex:1;padding:4px 10px 12px;overflow-y:auto;}
.nav-back{width:100%;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--tx3);margin-bottom:6px;}
.nav-back:hover{background:var(--hover);color:var(--tx);}
.nav-job{padding:6px 10px 14px;}
.nav-job .o{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:2px;}
.nav-job .n{font-size:13px;font-weight:600;line-height:1.4;display:block;}
.nav-job .m{font-size:11.5px;color:var(--tx2);margin-top:4px;display:block;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--tx2);margin-bottom:1px;text-align:left;}
.nav-item:hover{background:var(--hover);color:var(--tx);}
.nav-item.on{background:var(--pri-weak);color:var(--pri);font-weight:600;}
.nav-item .tail{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:500;display:flex;}
.nav-item.on .tail{color:var(--pri);}
.nav-sub{width:100%;text-align:left;height:30px;padding:0 10px 0 36px;border-radius:6px;font-size:13px;color:var(--tx2);}
.nav-sub:hover{background:var(--hover);color:var(--tx);}
.nav-sub.on{color:var(--tx);font-weight:600;}
.nav-foot{border-top:1px solid var(--line);padding:12px 10px;}
.me{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer;}
.me:hover{background:var(--hover);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;}
.me .nm{font-size:13px;font-weight:600;} .me .rl{font-size:11.5px;color:var(--tx3);}

.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1480px;}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;}
.phead h1{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:1.3;margin-bottom:6px;}
.phead p{font-size:13.5px;color:var(--tx2);}
.phead .pr{display:flex;gap:8px;align-items:center;flex-shrink:0;}

/* 섹션 */
.sec{margin-top:40px;}
.sec:first-child{margin-top:0;}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:32px;}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:-0.015em;}
.sec-h .meta{font-size:12.5px;color:var(--tx3);}
.sp{flex:1;}
.cols{display:grid;gap:44px;align-items:start;}
.muted{color:var(--tx2);} .faint{color:var(--tx3);} .strong{font-weight:600;} .num{font-variant-numeric:tabular-nums;}
.note{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.55;}
.row{display:flex;align-items:center;gap:8px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}

/* 숫자 요약 */
.kpis{display:flex;margin-bottom:36px;flex-wrap:wrap;row-gap:16px;}
.kpi{padding:0 32px;border-left:1px solid var(--line);}
.kpi:first-child{padding-left:0;border-left:0;}
.kpi .lb{font-size:12.5px;color:var(--tx3);margin-bottom:4px;}
.kpi .vl{font-size:24px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi .vl small{font-size:13px;color:var(--tx3);font-weight:500;margin-left:3px;}
.kpi .vl.err{color:var(--err);} .kpi .vl.warn{color:var(--warn);}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--tx);white-space:nowrap;transition:background .12s;}
.btn:hover{background:var(--hover);}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;}
.btn.pri:hover{background:var(--pri-h);}
.btn.ghost{border-color:transparent;background:none;color:var(--tx2);}
.btn.ghost:hover{background:var(--hover);color:var(--tx);}
.btn.danger{color:var(--err);}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;}
.btn.xs{height:26px;padding:0 9px;font-size:12px;font-weight:500;}
.btn.block{width:100%;height:40px;}
.btn[disabled]{opacity:.4;pointer-events:none;}

/* 상태 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--tx2);white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tx3);flex-shrink:0;}
.st.pri{color:var(--pri);} .st.pri::before{background:var(--pri);}
.st.ok{color:var(--ok);} .st.ok::before{background:var(--ok);}
.st.warn{color:var(--warn);} .st.warn::before{background:var(--warn);}
.st.err{color:var(--err);} .st.err::before{background:var(--err);}
.st.off{color:var(--tx3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:5px;background:var(--bg-sub);color:var(--tx2);border:1px solid var(--line);white-space:nowrap;}
.tag.pri{background:var(--pri-weak);color:var(--pri);border-color:var(--pri-line);}
.tag.ai{background:var(--pri-weak);color:var(--pri);border-color:transparent;}

/* 입력 */
.input,.textarea,.select{width:100%;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:0 10px;height:34px;font-size:13px;outline:none;transition:.12s;}
.textarea{height:auto;min-height:80px;padding:9px 10px;resize:vertical;line-height:1.55;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,102,224,.12);}
.input[disabled],.select[disabled],.textarea[disabled]{background:var(--bg-sub);color:var(--tx2);}
.input.sm,.select.sm{height:28px;font-size:12.5px;padding:0 8px;}
.input.err{border-color:var(--err);}
.field{margin-bottom:14px;} .field label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500;}
.field .hint{font-size:11.5px;color:var(--tx3);margin-top:4px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.search{position:relative;} .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);} .search .input{padding-left:32px;height:32px;font-size:12.5px;background:var(--bg-sub);border-color:transparent;}
.search .input:focus{background:#fff;}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
.chk input{width:16px;height:16px;accent-color:var(--pri);cursor:pointer;}
.tg{width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;transition:.2s;flex-shrink:0;}
.tg::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s;}
.tg.on{background:var(--pri);} .tg.on::after{left:18px;}

/* 표 */
table{width:100%;border-collapse:collapse;}
.tbl{border-top:1px solid var(--line2);}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--tx3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{font-size:13px;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl th:first-child,.tbl td:first-child{padding-left:4px;}
.tbl tbody tr.click{cursor:pointer;} .tbl tbody tr.click:hover td{background:var(--bg-sub);}
.tbl tbody tr.sel td{background:var(--pri-weak);}
.tbl tr.bad td{background:var(--err-weak);}
.tbl tr.block td{background:var(--bg-sub);color:var(--tx3);font-size:12.5px;padding-top:7px;padding-bottom:7px;}
.tbl tr.now td{background:#F7FAFF;}
.tbl tr.now td:first-child{box-shadow:inset 3px 0 0 var(--pri);}
.tbl tr.gsep td{border-top:1px solid var(--line2);}
.tbl td.r,.tbl th.r{text-align:right;} .tbl td.c,.tbl th.c{text-align:center;}
.tbl-wrap{overflow-x:auto;}
.board td,.board th{white-space:nowrap;padding-left:8px;padding-right:8px;}
.tbl td[rowspan]{vertical-align:top;padding-top:13px;}

/* 콜아웃 */
.callout{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;font-size:13px;background:var(--bg-sub);color:var(--tx2);margin-bottom:20px;}
.callout b{color:var(--tx);font-weight:600;}
.callout.pri{background:var(--pri-weak);color:var(--pri);} .callout.pri b{color:var(--pri);}
.callout.warn{background:var(--warn-weak);color:var(--warn);} .callout.warn b{color:var(--warn);}
.callout.err{background:var(--err-weak);color:var(--err);} .callout.err b{color:var(--err);}
.callout.ok{background:var(--ok-weak);color:var(--ok);} .callout.ok b{color:var(--ok);}

/* 패널 */
.panel{border:1px solid var(--line2);border-radius:var(--r);padding:20px;background:#fff;}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.panel-h h3{font-size:15px;font-weight:700;}
.sticky{position:sticky;top:24px;}

/* 탭·세그먼트 */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.tab{padding:10px 0;font-size:13.5px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--tx);}
.tab.on{color:var(--tx);font-weight:600;border-bottom-color:var(--tx);}
.seg{display:inline-flex;background:var(--bg-sub);border-radius:7px;padding:2px;gap:2px;}
.seg button{height:26px;padding:0 11px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--tx2);}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(15,30,69,.08);}

/* 준비 단계 진행선 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;margin-bottom:36px;}
.step{position:relative;text-align:left;padding-top:14px;}
.step .bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:2px;background:var(--line);}
.step.done .bar{background:var(--tx3);}
.step.on .bar{background:var(--pri);}
.step .t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.step .t b{font-size:14.5px;font-weight:700;}
.step.on .t b{color:var(--pri);}
.step .d{font-size:12.5px;color:var(--tx3);}
.step:hover .t b{text-decoration:underline;text-underline-offset:3px;}

/* 업로드 */
.drop{border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg-sub);padding:28px 16px;text-align:center;cursor:pointer;transition:.12s;}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-weak);}
.drop b{display:block;font-size:13.5px;margin-bottom:3px;}
.drop span{font-size:12px;color:var(--tx3);}

/* 시간표 */
.rooms{display:grid;gap:28px;}
.room-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.room-h b{font-size:14px;}
.sess-t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.sess-t small{font-weight:500;color:var(--tx3);margin-left:4px;}
.dly{font-size:11.5px;font-weight:700;color:var(--err);margin-left:4px;}
.shr{font-size:11.5px;font-weight:700;color:var(--ok);margin-left:4px;}
.hist{font-size:12.5px;}
.hist div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;}
.hist span{color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* AI 초안 */
.drafts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.draft{border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;text-align:left;background:#fff;}
.draft:hover{border-color:var(--pri-line);}
.draft.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset;}
.draft b{font-size:13.5px;display:block;margin-bottom:4px;}
.draft p{font-size:12.5px;color:var(--tx2);line-height:1.5;}
.qedit{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);}
.qedit .n{width:22px;font-size:12.5px;color:var(--tx3);padding-top:7px;font-weight:600;}
.qedit .textarea{min-height:36px;height:36px;padding:7px 10px;}

/* 마스킹 문서 */
.doc{border:1px solid var(--line2);border-radius:var(--r);padding:22px 24px;background:#fff;font-size:13.5px;line-height:1.75;}
.doc h5{font-size:12.5px;color:var(--tx3);font-weight:600;margin:16px 0 4px;}
.doc h5:first-child{margin-top:0;}
.mk{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--tx3);padding:0 7px;border-radius:4px;background:#EEF0F3;line-height:1.7;vertical-align:1px;}
.hl-miss{background:var(--warn-weak);color:var(--warn);border-radius:3px;padding:0 2px;font-weight:600;}

/* 발송 미리보기 */
.msg{background:var(--bg-sub);border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.7;white-space:pre-line;}
.msg b{display:block;font-size:13.5px;margin-bottom:6px;}

/* 이슈 */
.iss{padding:12px 0;border-bottom:1px solid var(--line);}
.iss:last-child{border-bottom:0;}
.iss.open{border-left:3px solid var(--warn);padding-left:10px;}
.iss .t{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.iss .m{font-size:12px;color:var(--tx3);display:flex;gap:8px;align-items:center;}
.conduct{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.conduct .tm{width:44px;font-weight:700;font-variant-numeric:tabular-nums;}
.conduct.late .tm{color:var(--err);}
.conduct .tx{flex:1;}
.conduct.done .tx,.conduct.done .tm{color:var(--tx3);}

/* 점수 */
.ev-row{padding:16px 0;border-bottom:1px solid var(--line);}
.ev-row:first-child{padding-top:0;}
.ev-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ev-h b{font-size:13.5px;}
.ev-sc{display:grid;gap:8px;}
.ev-sc div{background:var(--bg-sub);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--tx3);}
.ev-sc div b{display:block;font-size:14px;color:var(--tx);font-variant-numeric:tabular-nums;}
.ev-cm{font-size:13px;color:var(--tx2);margin-top:8px;}
.big-score{font-size:28px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.plist{display:flex;flex-direction:column;gap:1px;max-height:560px;overflow-y:auto;}
.prow{width:100%;text-align:left;padding:8px 10px;border-radius:6px;}
.prow:hover{background:var(--hover);}
.prow.on{background:var(--pri-weak);}
.prow .r1{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13.5px;font-weight:600;}
.prow.on .r1{color:var(--pri);}
.prow .r2{font-size:12px;color:var(--tx3);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;}

/* 캘린더 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-h b{font-size:14px;}
.cal-h button{width:26px;height:26px;border-radius:6px;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;color:var(--tx2);}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal .w{font-size:11.5px;color:var(--tx3);padding:2px 0;}
.cal button{aspect-ratio:1;border-radius:50%;font-size:12.5px;color:var(--tx2);position:relative;}
.cal button:hover{background:var(--hover);}
.cal button.has{color:var(--tx);font-weight:700;}
.cal button.has::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--pri);}
.cal button.sel{box-shadow:inset 0 0 0 1.5px var(--pri);}
.cal button.today{background:var(--pri);color:#fff;font-weight:700;}
.cal button.today::after{background:#fff;}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(15,30,69,.36);display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;z-index:60;overflow-y:auto;animation:fade .15s;}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:var(--sh-pop);animation:up .18s;}
.modal.wide{max-width:780px;}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 4px;}
.mh b{font-size:16px;font-weight:700;}
.mh button{color:var(--tx3);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.mh button:hover{background:var(--hover);color:var(--tx);}
.mb{padding:14px 22px 20px;font-size:13.5px;line-height:1.6;}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:11px 16px;border-radius:8px;display:flex;align-items:center;gap:8px;z-index:80;box-shadow:var(--sh-pop);animation:up .2s;max-width:80vw;}

<body>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="view"></main>
</div>
<div id="modal-root"></div>
<div class="shield-ov"><div class="box"><b>화면 보호 중</b>개인정보 보호를 위한 자동 가림 · 창 복귀 시 해제</div></div>

<script>
/* =====================================================================
   ONSITE BETA · 공통 엔진 (마스터 관리자 · 운영관리자 동일)
   - 면접일 하루(CONFIG.date) 전용 · 시간표는 미리 생성·확정된 상태로 시작
   - 저장: 이 브라우저(localStorage) · 같은 브라우저의 다른 탭과 실시간 연동
   - 기기 간 공유(선택): CONFIG.SYNC_URL 에 Firebase Realtime Database 주소 입력
   ===================================================================== */
const CONFIG={
  title:'2026년 한국소방산업기술원 채용 1차면접(실기) 전형',
  org:'한국소방산업기술원',
  date:'2026.11.11', dow:'수',
  place:'한국소방산업기술원 (장소는 CONFIG.place에서 수정)',
  code:'KFI26',
  /* 지원자 명단 (실제 데이터)
     applicants 에 한 줄씩 넣어 주세요 · no=수험번호, name=성명, field=지원분야, phone=연락처(선택)
     예) {no:'A-001',name:'홍길동',field:'경영',phone:'010-1234-5678'},
     비워 두면 아래 roster 기준으로 가상 명단을 만들어요 (테스트용) */
  applicants:[
  ],
  roster:[['경영',20],['행정',15],['전산',10]], rosterPrefix:'A',
  /* 시간표 조건 (확정본) */
  cfg:{type:'group',start:'09:30',dur:20,rest:10,rooms:2,lunch:true,lunchStart:'12:30',lunchLen:60,arrive:30,groupMax:5,groupMaxMin:50,perMin:10},
  useDevice:true, useFee:true,
  statuses:['','접수예정','접수','연락중','불참'],
  /* 마스터 계정 · 첫 로그인 때 비밀번호 변경을 요구해요 */
  master:{id:'minnky23@gmail.com',name:'김민경',initPw:'Onsite2026!'},
  /* 운영관리자 계정은 마스터 화면 > 운영자 초대에서 직접 만들어요
     초대 링크가 운영자 화면 주소를 가리키도록, 두 파일을 다른 저장소에 올리면 운영자 화면 주소를 넣어 주세요
     예) 'https://wombat20.github.io/onsite/beta-operator.html' · 비워 두면 같은 폴더의 beta-operator.html */
  operatorUrl:'',
  /* 선택: 휴대폰(운영자)과 PC(마스터)를 실시간으로 연결하려면 Firebase Realtime Database 주소를 넣어 주세요
     예) 'https://내프로젝트-default-rtdb.asia-southeast1.firebasedatabase.app/onsite-beta'
     비워 두면 이 브라우저에만 저장돼요 (같은 브라우저의 다른 탭끼리는 실시간 연동) */
  SYNC_URL:''
};

/* ---------- 유틸 ---------- */
const pad=n=>String(n).padStart(2,'0');
const T=s=>{if(!s)return 0;const[a,b]=String(s).split(':').map(Number);return a*60+b;};
const HM=m=>pad(Math.floor(m/60))+':'+pad(((m%60)+60)%60);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return h;};
const rnd=(seed,n)=>hash(seed)%n;
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ---------- 시각 (실제 시계 · 테스트용 ?t=13:15 고정 가능) ---------- */
const QS=new URLSearchParams(location.search);
let FIXED=(QS.get('t')&&/^\d{1,2}:\d{2}$/.test(QS.get('t')))?T(QS.get('t')):null;
function nowMin(){if(FIXED!=null)return FIXED;const d=new Date();return d.getHours()*60+d.getMinutes();}
function shiftClock(d){if(FIXED==null)return;FIXED=Math.max(T('07:00'),Math.min(T('20:00'),FIXED+d));}
function todayStr(){const d=new Date();return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;}
const isEventDay=()=>todayStr()===CONFIG.date;
function stamp(){const d=new Date();return `${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}
const DATE_LABEL=`${CONFIG.date}(${CONFIG.dow})`;

/* ---------- 명단 ---------- */
const SURN='김이박최정강조윤장임한오서신권황안송류홍'.split('');
const GIVEN=['민준','서연','도윤','지우','하준','서윤','시우','하은','지호','수아','예준','지민','유진','현우','채원','준서','다은','건우','소율','우진','예린','태윤','나연','정훈','가은'];
function mkName(seed){return SURN[rnd(seed+'s',SURN.length)]+GIVEN[rnd(seed+'g',GIVEN.length)];}
function mkRoster(spec,prefix){
  const rows=[];let k=1;
  spec.forEach(([field,n])=>{for(let i=0;i<n;i++){const no=`${prefix}-${String(1000+k).slice(1)}`;const seed=no+field;
    rows.push({no,name:mkName(seed),field,phone:`010-${String(2000+rnd(seed+'p',7000))}-${String(1000+rnd(seed+'q',8999))}`});k++;}});
  return rows;
}
function blankApp(){return{ino:'',status:'',device:'',inR:false,outR:false,fee:false,delay:0,note:'',ck:null};}

const USING_SAMPLE=!(CONFIG.applicants&&CONFIG.applicants.length);
const J={name:CONFIG.title,org:CONFIG.org,date:CONFIG.date,place:CONFIG.place,
  roster:(CONFIG.applicants&&CONFIG.applicants.length)
    ?CONFIG.applicants.filter(a=>a&&a.no&&a.name).map(a=>({no:String(a.no).trim(),name:String(a.name).trim(),field:String(a.field||'미지정').trim(),phone:String(a.phone||'').trim()}))
    :mkRoster(CONFIG.roster,CONFIG.rosterPrefix),
  rosterErrs:[],apps:{},arrive:{},sched:null,cfg:Object.assign({},CONFIG.cfg)};
J.roster.forEach(r=>J.apps[r.no]=blankApp());

/* ---------- 시간표 엔진 (기존 프로토타입과 동일 로직) ---------- */
function validRoster(j){const bad=new Set(j.rosterErrs.map(e=>e.no));return j.roster.filter(r=>!bad.has(r.no));}
function app(j,no){return j.apps[no]||(j.apps[no]=blankApp());}
function person(j,no){return j.roster.find(r=>r.no===no);}
function unitLen(j,attend){const c=j.cfg;return c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):c.dur;}
function buildSchedule(j){
  const c=j.cfg;const R=Math.max(1,+c.rooms||1);
  const byF={};validRoster(j).forEach(r=>{(byF[r.field]=byF[r.field]||[]).push(r.no);});
  let pieces=Object.entries(byF).map(([f,nos])=>{const units=[];const size=c.type==='group'?Math.max(1,+c.groupMax):1;for(let i=0;i<nos.length;i+=size)units.push(nos.slice(i,i+size));return{field:f,units};});
  while(pieces.length<R){pieces.sort((a,b)=>b.units.length-a.units.length);const p=pieces[0];if(p.units.length<2)break;const h=Math.ceil(p.units.length/2);pieces.splice(0,1,{field:p.field,units:p.units.slice(0,h)},{field:p.field,units:p.units.slice(h)});}
  pieces.sort((a,b)=>b.units.length-a.units.length);
  const rooms=Array.from({length:R},(_,i)=>({name:`${i+1}면접실`,start:c.start,items:[],load:0}));
  pieces.forEach(p=>{const r=rooms.reduce((a,b)=>b.load<a.load?b:a);p.units.forEach(u=>r.items.push({kind:'s',field:p.field,members:u}));r.load+=sum(p.units.map(u=>unitLen(j,u.length)+c.rest));});
  rooms.forEach((r,ri)=>{
    let cur=T(r.start);const out=[];let placed=!c.lunch;
    r.items.forEach(it=>{
      const len=unitLen(j,it.members.length);
      if(!placed&&cur>=T('11:30')&&cur+len>T(c.lunchStart)+20){out.push({kind:'lunch',start:HM(Math.min(cur,T('13:30'))),len:+c.lunchLen});cur=Math.max(cur,T('11:30'))+(+c.lunchLen);placed=true;}
      out.push(it);cur+=len+(+c.rest);
    });
    out.forEach((it,k)=>it.id=`${it.kind==='s'?'s':'b'}${ri}_${k}`);
    r.items=out;delete r.load;
  });
  j.sched={rooms};
  numberSchedule(j);
}
function numberSchedule(j){
  const all=[];j.sched.rooms.forEach((r,ri)=>timeline(j,r,false).forEach(x=>{if(x.kind==='s')all.push({x,ri});}));
  all.sort((a,b)=>a.x.s-b.x.s||a.ri-b.ri);
  const cnt={},gcnt={};
  all.forEach(({x})=>{gcnt[x.field]=(gcnt[x.field]||0)+1;x.it.label=j.cfg.type==='group'?`${x.field} ${gcnt[x.field]}조`:x.field;x.members.forEach(no=>{cnt[x.field]=(cnt[x.field]||0)+1;app(j,no).ino=x.field+pad(cnt[x.field]);});});
}
function timeline(j,room,actual){
  const c=j.cfg;let cur=T(room.start);const out=[];
  room.items.forEach(it=>{
    if(it.kind==='lunch'||it.kind==='break'){const s=Math.max(cur,T(it.start));out.push({kind:it.kind,it,s,e:s+it.len});cur=s+it.len;return;}
    const attend=actual?it.members.filter(no=>app(j,no).status!=='불참').length:it.members.length;
    const len=c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):c.dur;
    const planLen=unitLen(j,it.members.length);
    let s=cur;
    if(actual){const arr=Math.min(...it.members.map(no=>T(arriveOf(j,no))||0));if(arr)s=Math.max(cur,arr+10);}
    const delay=actual?sum(it.members.map(no=>+app(j,no).delay||0)):0;
    const e=s+len+delay;

  });

}

const STORE_KEY=`onsite-beta:${CONFIG.code}:${CONFIG.date}`;

const SYNC={on:!!CONFIG.SYNC_URL,state:CONFIG.SYNC_URL?'connecting':'local',listeners:[]};
const syncBase=()=>CONFIG.SYNC_URL.replace(/\/+$/,'');

function applyDB(){
  J.roster.forEach(r=>{const a=J.apps[r.no];const d=(DB.apps||{})[r.no]||{};

function setIn(o,path,val){
  const ks=String(path).split('/').filter(Boolean);let c=o;
  for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=='object')c[ks[i]]={};c=c[ks[i]];}
  const k=ks[ks.length-1];if(val==null)delete c[k];else c[k]=val;
}
function onDB(fn){SYNC.listeners.push(fn);}
function fireDB(){applyDB();SYNC.listeners.forEach(f=>{try{f();}catch(e){console.error(e);}});}
function remotePut(path,val){
  if(!SYNC.on)return;

async function hashPw(id,pw){const b=new TextEncoder().encode(String(id).trim().toLowerCase()+'|'+pw+'|onsite-beta');
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  let h=hash(String.fromCharCode(...b));for(let i=0;i<500;i++)h=hash(h+'|'+pw);return 'f'+h.toString(16);}
function genPw(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let p='';const r=new Uint32Array(8);(window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*1e9)}).getRandomValues(r);r.forEach(v=>p+=c[v%c.length]);return p.slice(0,4)+'-'+p.slice(4);}
function pwRule(pw,old){if(!pw||pw.length<8)return '8자 이상 입력해 주세요';if(!/[A-Za-z]/.test(pw)||!/[0-9]/.test(pw))return '영문과 숫자를 함께 넣어 주세요';if(old&&pw===old)return '처음 받은 비밀번호와 다르게 정해 주세요';return '';}

function render(){
  if(!S.auth&&S.change){document.querySelector('.app').classList.add('pre');$('#nav').innerHTML='';$('#view').innerHTML=pgChange();return;}
  if(!S.auth){document.querySelector('.app').classList.add('pre');$('#nav').innerHTML='';$('#view').innerHTML=pgLogin();return;}
  document.querySelector('.app').classList.remove('pre');
  renderNav();
  $('#view').innerHTML=({monitor:pgMonitor,sched:pgSched,people:pgPeople,admin:pgAdmin})[S.page]();
  const top=logList()[0];S.seenLog=top?top.k:S.seenLog||'0';
}
function keepScroll(fn){const y=window.scrollY;const tw=document.querySelector('.tbl-wrap');const x=tw?tw.scrollLeft:0;fn();window.scrollTo(0,y);const tw2=document.querySelector('.tbl-wrap');if(tw2)tw2.scrollLeft=x;}
let pending=false;
function safeRender(){const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.closest('#view')){pending=true;return;}if($('#modal-root').innerHTML){pending=true;return;}keepScroll(render);}
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(pending){pending=false;safeRender();}},0);});
onDB(safeRender);
setInterval(()=>{const m=nowMin();if(m!==S.lastMin){S.lastMin=m;safeRender();}},10000);

   계정 처리
   ===================================================================== */
async function doLogin(){
  const id=$('#lg-id').value.trim().toLowerCase(),pw=$('#lg-pw').value;S.lgId=id;
  if(!id||!pw){S.loginErr='이메일과 비밀번호를 입력해 주세요';render();return;}
  const m=masterAcc();
  const ok=id===ME.id.toLowerCase()&&(m&&m.pwHash?(await hashPw(ME.id,pw))===m.pwHash:pw===ME.initPw);
  if(!ok){S.loginErr='이메일 또는 비밀번호가 맞지 않아요';render();return;}
  S.loginErr='';
  if(!(m&&m.pwHash)){S.change=true;render();setTimeout(()=>{const el=$('#np1');el&&el.focus();},0);return;}
  S.auth=true;S.page='monitor';try{localStorage.setItem(AUTH_KEY,'1');}catch(e){}addLog(WHO,'로그인');render();
}
async function savePw(){
  const n=$('#np1').value,c=$('#np2').value;const err=pwRule(n,ME.initPw);
  if(err){S.loginErr=err;render();return;}if(n!==c){S.loginErr='새 비밀번호가 서로 달라요';render();return;}
  dbSet('accounts/master',{pwHash:await hashPw(ME.id,n),at:stamp()});
  S.change=false;S.loginErr='';S.auth=true;S.page='people';try{localStorage.setItem(AUTH_KEY,'1');}catch(e){}
  addLog(WHO,'첫 로그인 · 비밀번호 변경');render();toast('비밀번호를 바꿨어요 · 이제 운영자를 초대해 보세요');
}
async function changeMasterPw(){
  const o=$('#mp0').value,n=$('#mp1').value,c=$('#mp2').value;const E=$('#mp-err');const fail=m=>{E.style.display='flex';E.textContent=m;};
  if(await hashPw(ME.id,o)!==masterAcc().pwHash)return fail('현재 비밀번호가 맞지 않아요');
  const err=pwRule(n,o);if(err)return fail(err==='처음 받은 비밀번호와 다르게 정해 주세요'?'현재 비밀번호와 다르게 정해 주세요':err);
  if(n===ME.initPw)return fail('초기 비밀번호는 다시 쓸 수 없어요');
  if(n!==c)return fail('새 비밀번호가 서로 달라요');
  dbSet('accounts/master',{pwHash:await hashPw(ME.id,n),at:stamp()});addLog(WHO,'비밀번호 변경');closeModal();pending=false;keepScroll(render);toast('비밀번호를 바꿨어요');
}
async function createOp(){
  const name=$('#no-n').value.trim(),role=$('#no-r').value,phone=$('#no-p').value.trim();
  if(!name){toast('이름을 입력해 주세요',true);return;}
  if(phone&&!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)){toast('연락처 형식을 확인해 주세요',true);return;}
  const id=nextOpId();const temp=genPw();
  dbSet('accounts/ops/'+id,{name,role,phone,temp,pwHash:await hashPw(id,temp),mustChange:true,v:Date.now(),createdAt:stamp()});
  addLog(WHO,`운영자 초대 · ${name} ${id} (${role})`);pending=false;render();inviteModal(id,'초대 완료 · 안내문 보내기');
}
async function resetOp(id){
  const o=opAcc(id);const temp=genPw();
  const nx=Object.assign({},o,{temp,pwHash:await hashPw(id,temp),mustChange:true,v:Date.now(),disabled:false});delete nx.disabled;
  dbSet('accounts/ops/'+id,nx);addLog(WHO,`운영자 비밀번호 재발급 · ${o.name} ${id}`);pending=false;render();inviteModal(id,'재발급 완료 · 새 안내문 보내기');
}

    case 'copyLink':copyText(inviteLink(t.dataset.id)).then(ok=>toast(ok?'초대 링크를 복사했어요':'복사하지 못했어요',!ok));break;
    case 'opReset':{const o=opAcc(t.dataset.id);modal({title:'비밀번호 재발급',body:`<div>${esc(o.name)} · ${esc(t.dataset.id)}<br>새 임시 비밀번호를 만들고, 운영자는 다음 로그인 때 비밀번호를 다시 정해요.</div><div class="callout warn mt12" style="margin-bottom:0">${ic('alert')}<span>${SYNC.on?'사용 중인 휴대폰은 바로 로그아웃돼요':'새 안내문(새 초대 링크)을 다시 보내야 휴대폰에 적용돼요'}</span></div>`,actions:[{label:'취소',act:'closeModal'},{label:'재발급',act:'opResetDo',cls:'pri',data:`data-id="${esc(t.dataset.id)}"`}]});break;}
    case 'opResetDo':resetOp(t.dataset.id);break;
    case 'opToggle':{const id=t.dataset.id;const o=opAcc(id);dbSet('accounts/ops/'+id+'/disabled',o.disabled?null:true);addLog(WHO,`운영자 ${o.disabled?'다시 사용':'사용 중지'} · ${o.name} ${id}`);keepScroll(render);toast(`${o.name} · ${o.disabled?'다시 사용':'사용 중지'}`);break;}

    case 'doConduct':{const x=$('#cd-x').value.trim();if(!x){toast('내용을 입력해 주세요',true);break;}const tm=$('#cd-t').value||HM(nowMin());const id='x'+Date.now().toString(36);dbSet('extra/'+id,{t:tm,txt:x,who:$('#cd-w').value});addLog(WHO,`행동 강령 추가 · ${tm} ${x}`);closeModal();pending=false;keepScroll(render);toast('행동 강령 추가');break;}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.app){const[no,k]=t.dataset.app.split(':');const a=A(no);const old=a[k];

    if(k==='delay')toast(`${a.ino} DELAY ${v}분 · 이후 일정 연쇄 반영 · 도착시간 불변`);
    pending=false;keepScroll(render);return;}
  if(t.dataset.oprole){const id=t.dataset.oprole;const o=opAcc(id);dbSet('accounts/ops/'+id+'/role',t.value);addLog(WHO,`운영자 역할 변경 · ${o.name} ${o.role} → ${t.value}`);toast(`${o.name} · ${t.value}`);return;}
  if(t.dataset.appchk){const[no,k]=t.dataset.appchk.split(':');const a=A(no);const lb={inR:'입실',outR:'퇴실',fee:'면접비'}[k];setApp(no,{[k]:t.checked},WHO,`${a.ino} ${lb} ${t.checked?'체크':'해제'}`);return;}
});

/* 캡처 방지 */
(function(){const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='280' height='140'><text x='10' y='90' transform='rotate(-22 140 70)' font-family='sans-serif' font-size='12' fill='rgba(15,30,69,0.05)'>${ME.name} · 마스터 관리자 · ONSITE BETA</text></svg>`;document.documentElement.style.setProperty('--wm',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);})();
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('shield',document.hidden&&!!document.querySelector('.secure'));});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.secure')){e.preventDefault();toast('개인정보 보호 영역 · 우클릭 제한',true);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();toast('인쇄·저장 제한 · 개인정보 보호',true);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  if(['lg-id','lg-pw'].includes(id)){e.preventDefault();doLogin();}else if(['np1','np2'].includes(id)){e.preventDefault();savePw();}
  else if(['mp0','mp1','mp2'].includes(id)){e.preventDefault();changeMasterPw();}else if(['no-n','no-p'].includes(id)){e.preventDefault();createOp();}});

render();
</script>
