<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>ONSITE BETA — 운영관리자</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<!-- 글꼴은 화면을 막지 않게 늦게 불러와요 (못 받아도 시스템 글꼴로 보여요) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
  --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;--line:#ECEEF3;--line2:#DFE3EB;
  --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
  --ok:#1F9254;--ok-weak:#EAF6EF;--warn:#B8740F;--warn-weak:#FDF6EA;--err:#E5383B;--err-weak:#FDF1F1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Wanted Sans Variable','Wanted Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.01em;color:var(--tx);line-height:1.5;background:#EDEEF1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 0 34px;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit;}
button{background:none;border:0;cursor:pointer;}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
svg.i.s14{width:14px;height:14px;} svg.i.s22{width:22px;height:22px;}

/* 시연 컨트롤 (프레임 밖) */
.doc-tag{font-size:12px;color:#8A8F99;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.doc-tag .logo-sym{height:12px;width:auto;display:inline-block;vertical-align:-1px;margin-right:5px;}
.demo{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #E1E3E8;border-radius:8px;padding:3px 4px 3px 10px;}
.demo b{color:var(--tx);font-variant-numeric:tabular-nums;margin:0 4px;}
.demo button{height:24px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--tx2);}
.demo button:hover{background:var(--hover);color:var(--tx);}

/* 프레임 */
.frame{width:392px;height:866px;background:var(--bg);border:1px solid #E1E3E8;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 14px 30px rgba(22,22,29,.06),0 44px 88px rgba(22,22,29,.08);}
.statusbar{height:50px;flex-shrink:0;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 9px;}
.statusbar .t{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.statusbar .sys{display:flex;align-items:center;gap:6px;}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#0b0b0e;border-radius:16px;}
.main{flex:1;overflow:hidden;position:relative;}
.main::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--wm);z-index:5;}
.page{height:100%;overflow-y:auto;padding:8px 20px 28px;}
.page::-webkit-scrollbar{width:0;}
.secure{-webkit-user-select:none;user-select:none;}
body.shield .main{filter:blur(10px);}
.frame.pre .main::after{display:none;}
.shield-ov{display:none;position:absolute;inset:50px 0 0;z-index:40;align-items:center;justify-content:center;}
body.shield .shield-ov{display:flex;}
.shield-ov div{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px 20px;text-align:center;font-size:13px;color:var(--tx2);box-shadow:0 12px 32px -8px rgba(15,30,69,.18);}
.shield-ov b{display:block;color:var(--tx);font-size:14.5px;margin-bottom:2px;}

/* 공통 */
.appbar{display:flex;align-items:center;height:44px;margin-bottom:12px;}
.appbar .logo-sym{height:22px;width:auto;display:block;}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--tx2);}
.iconbtn:hover{background:var(--hover);}
.iconbtn .nd{position:absolute;top:7px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ml{margin-left:auto;} .mr-8{margin-right:-8px;}
.ttl{font-size:22px;font-weight:700;letter-spacing:-0.025em;margin:6px 0 4px;}
.sub{font-size:13px;color:var(--tx2);margin-bottom:20px;}
.sec{margin-top:28px;}
.sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px;}
.sec-h .meta{font-size:12.5px;font-weight:500;color:var(--tx3);}
.note{font-size:12px;color:var(--tx3);line-height:1.55;margin-top:10px;}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.pri{color:var(--pri);} .st.ok{color:var(--ok);} .st.warn{color:var(--warn);} .st.err{color:var(--err);} .st.mute{color:var(--tx2);}
.callout{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:14px;}
.callout svg{margin-top:1px;}
.callout.err{background:var(--err-weak);color:var(--err);} .callout.warn{background:var(--warn-weak);color:var(--warn);} .callout.pri{background:var(--pri-weak);color:var(--pri);} .callout.ok{background:var(--ok-weak);color:var(--ok);}
.callout b{font-weight:700;}
.btn{height:48px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;width:100%;}
.btn:hover{background:var(--pri-h);}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--line2);}
.btn.ghost:hover{background:var(--hover);}
.btn.soft{background:var(--bg-sub);color:var(--tx);} .btn.soft:hover{background:var(--hover);}
.btn.danger{background:var(--err);}
.btn.sm{height:36px;font-size:13.5px;border-radius:9px;width:auto;padding:0 14px;}
.btn[disabled]{opacity:.35;pointer-events:none;}
.btns{display:flex;gap:8px;}
.input{width:100%;height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;font-size:15px;outline:none;background:#fff;}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,102,224,.12);}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:none;line-height:1.5;}
.flabel{font-size:13px;font-weight:600;color:var(--tx2);margin:16px 0 7px;}
.seg{display:flex;background:var(--bg-sub);border-radius:10px;padding:3px;gap:2px;}
.seg button{flex:1;height:34px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--tx2);white-space:nowrap;}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 2px rgba(15,30,69,.1);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;color:var(--tx2);background:#fff;}
.chip.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);font-weight:700;}
.chip.on.err{border-color:var(--err);background:var(--err-weak);color:var(--err);}
.chip.on.warn{border-color:var(--warn);background:var(--warn-weak);color:var(--warn);}
.search{display:flex;align-items:center;gap:8px;height:44px;background:var(--bg-sub);border-radius:10px;padding:0 12px;color:var(--tx3);flex:1;}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;color:var(--tx);min-width:0;}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer;}
.toggle:last-child{border-bottom:0;}
.cbox{width:22px;height:22px;border:1.6px solid var(--line2);border-radius:6px;flex-shrink:0;position:relative;background:#fff;}
.cbox.on{background:var(--pri);border-color:var(--pri);}
.cbox.on::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);top:5px;left:4.5px;}
.kv{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--tx2);} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;}

/* 운영보드 */
.job .org{font-size:12.5px;color:var(--tx3);font-weight:500;}
.job .nm{font-size:15px;font-weight:600;letter-spacing:-0.02em;line-height:1.45;color:var(--tx2);}
.hero{margin-top:20px;}
.hero .big{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.3;}
.hero .big em{font-style:normal;color:var(--pri);}
.hero .big small{font-size:15px;color:var(--tx3);font-weight:600;margin-left:4px;}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px;}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s;}
.facts{display:flex;margin-top:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.fact{flex:1;min-width:0;}
.fact+.fact{padding-left:12px;border-left:1px solid var(--line);margin-left:12px;}
.fact span{display:block;font-size:12px;color:var(--tx3);margin-bottom:2px;white-space:nowrap;}
.fact b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.fact.warn b{color:var(--warn);} .fact.err b{color:var(--err);}
.nowstrip{padding:4px 16px;}
.sess{background:#fff;border-radius:16px;padding:2px 14px 4px;margin-top:10px;}
.sess .prow:last-child{border-bottom:0;}
.sess-h{border-bottom-color:var(--line);}
.block{background:#E3E7EF;}
.nowrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;}
.nowrow+.nowrow{border-top:1px solid var(--line);}
.nowrow .rn{font-weight:700;width:58px;flex-shrink:0;}
.nowrow .ss{flex:1;color:var(--tx2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowrow .ss b{color:var(--tx);}
.dly{font-size:11.5px;font-weight:700;color:var(--err);margin-left:3px;}
.shr{font-size:11.5px;font-weight:700;color:var(--ok);margin-left:3px;}
.tools{display:flex;gap:8px;margin:12px 0 4px;}
.qrbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:var(--pri);color:#fff;border-radius:10px;font-size:14px;font-weight:700;white-space:nowrap;}
.sess{margin-top:6px;}
.lhead{display:flex;gap:10px;font-size:11.5px;color:var(--tx3);padding:12px 4px 0;}
.lhead span:first-child{width:46px;} .lhead span:nth-child(2){flex:1;}
.sess-h{display:flex;align-items:baseline;gap:8px;padding:10px 0 8px;border-bottom:1px solid var(--line2);}
.sess-h .tm{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.sess-h .lb{font-size:12.5px;color:var(--tx2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sess-h .rc{font-size:12.5px;color:var(--ok);font-weight:600;}
.sess.now .sess-h .tm{color:var(--pri);}
.sess.done .sess-h .tm,.sess.done .sess-h .lb{color:var(--tx3);}
.nowtag{font-size:11.5px;font-weight:700;color:#fff;background:var(--pri);border-radius:4px;padding:0 6px;line-height:18px;}
.prow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.prow:hover{background:var(--bg-sub);}
.prow .no{width:46px;flex-shrink:0;font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums;}
.prow .who{flex:1;min-width:0;}
.prow .l1{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:baseline;}
.prow .l1 span{font-weight:500;color:var(--tx2);font-size:14px;}
.prow .l2{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow .l2 i{font-style:normal;color:var(--err);font-weight:600;}
.prow.absent .l1,.prow.absent .l1 span{color:var(--tx3);text-decoration:line-through;}
.block{display:flex;align-items:center;gap:8px;padding:11px 12px;margin-top:14px;background:var(--bg-sub);border-radius:10px;font-size:13px;color:var(--tx2);cursor:pointer;}
.block b{font-variant-numeric:tabular-nums;color:var(--tx);}
.block.gap{cursor:default;}
.block .ed{margin-left:auto;color:var(--tx3);font-size:12.5px;display:flex;align-items:center;gap:3px;}
.empty{padding:28px 16px;text-align:center;font-size:13.5px;color:var(--tx3);line-height:1.6;background:var(--bg-sub);border-radius:12px;margin-top:14px;}

/* 바텀시트 · 다이얼로그 · 토스트 */
.dim{position:absolute;inset:0;background:rgba(15,30,69,.36);z-index:20;display:flex;flex-direction:column;justify-content:flex-end;}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px 26px;}
.dim.anim{animation:fade .15s;} .dim.anim .sheet{animation:up .2s;}
.sheet::-webkit-scrollbar{width:0;}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px;}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.sh-h .inum{font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;}
.sh-h .nm{font-size:15px;font-weight:600;margin-top:2px;}
.sh-h .meta{font-size:12.5px;color:var(--tx3);}
.sh-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper button{width:46px;height:46px;border-radius:10px;background:var(--bg-sub);font-size:13px;font-weight:700;color:var(--tx2);}
.stepper button:hover{background:var(--hover);}
.stepper .input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;flex:1;}
.call{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;background:var(--pri-weak);color:var(--pri);font-size:12.5px;font-weight:700;text-decoration:none;margin-left:8px;}
.dlg-wrap{position:absolute;inset:0;background:rgba(15,30,69,.42);z-index:30;display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .15s;}
.dlg{background:#fff;border-radius:16px;padding:22px 20px 18px;width:100%;}
.dlg b{display:block;font-size:16.5px;margin-bottom:6px;}
.dlg p{font-size:13.5px;color:var(--tx2);line-height:1.55;margin-bottom:18px;}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--navy);color:#fff;font-size:13px;padding:12px 14px;border-radius:10px;z-index:50;display:flex;gap:8px;align-items:flex-start;animation:up .2s;line-height:1.45;}
.toast.red{background:var(--err);}

/* 체크인 */
.idchk{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid transparent;background:#fff;border-radius:14px;cursor:pointer;}
.idchk.on{border-color:var(--pri);background:var(--pri-weak);}
.idchk .t{font-size:14.5px;font-weight:700;} .idchk .d{font-size:12.5px;color:var(--tx2);}
.vf{margin-top:12px;height:270px;border-radius:16px;background:#121826;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.vf .box{width:170px;height:170px;position:relative;}
.vf .box i{position:absolute;width:30px;height:30px;border:3px solid #fff;}
.vf .box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0;}
.vf .box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0;}
.vf .box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px;}
.vf .box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0;}
.vf .line{position:absolute;left:12px;right:12px;height:2px;background:var(--sky);top:12px;animation:scan 1.8s ease-in-out infinite alternate;box-shadow:0 0 12px var(--sky);}
@keyframes scan{to{top:156px}}
.vf .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12.5px;}
.vf.off{background:#2A3142;} .vf.off .line{display:none;} .vf.off .box i{border-color:rgba(255,255,255,.3);}
.res{text-align:center;padding:24px 16px 18px;background:#fff;border-radius:20px;}
.res .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--ok-weak);color:var(--ok);}
.res .ic svg{width:28px;height:28px;stroke-width:2.4;}
.res.warn .ic{background:var(--warn-weak);color:var(--warn);}
.res .lab{font-size:13px;color:var(--tx2);font-weight:600;}
.res .inum{font-size:52px;font-weight:800;letter-spacing:-0.04em;line-height:1.1;margin:4px 0 2px;}
.res .nm{font-size:17px;font-weight:700;}
.res .meta{font-size:13px;color:var(--tx3);margin-top:2px;}
.recent .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.recent .r:last-child{border-bottom:0;}
.recent .r .tm{color:var(--tx3);font-variant-numeric:tabular-nums;width:40px;}
.recent .r b{font-weight:700;}
.recent .r .how{margin-left:auto;font-size:12px;color:var(--tx3);}

/* 행동 강령 */
.sum .big{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;}
.sum .big em{font-style:normal;color:var(--pri);}
.sum .big em.err{color:var(--err);}
.titem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.card .titem:last-child{border-bottom:0;}
.titem .tchk{width:24px;height:24px;border:1.6px solid var(--line2);border-radius:7px;flex-shrink:0;cursor:pointer;position:relative;}
.titem .tchk.on{background:var(--pri);border-color:var(--pri);}
.titem .tchk.on::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);top:6px;left:5px;}
.titem .tm{font-size:15px;font-weight:700;width:46px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.titem .bd{flex:1;min-width:0;}
.titem .do{font-size:14px;font-weight:600;}
.titem .who{font-size:12px;color:var(--tx3);}
.titem.late .tm{color:var(--err);}
.titem.soon .tm{color:var(--pri);}
.titem.fin .tm,.titem.fin .do{color:var(--tx3);}
.card .nowline{margin:8px 0;}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:11.5px;font-weight:700;color:var(--pri);}

.noti .n .k.err{color:var(--err);} .noti .n .k.pri{color:var(--pri);} .noti .n .k.mute{color:var(--tx3);}
.noti .n .x{font-size:13.5px;line-height:1.5;flex:1;}
.noti .n .x small{display:block;color:var(--tx3);font-size:12px;}

/* 이슈 */
.iss{padding:14px 16px;background:#fff;border-radius:14px;margin-top:8px;}
.iss.open{box-shadow:inset 3px 0 0 var(--err);}
.iss .t{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:4px;}

.photo-pick .add{width:72px;height:72px;border:1px dashed var(--line2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx3);font-size:11.5px;cursor:pointer;}
.photo-pick img{width:72px;height:72px;border-radius:10px;object-fit:cover;}

/* 마이 */
.profile{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:18px;}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--tx2);}
.profile .nm{font-size:18px;font-weight:700;} .profile .rl{font-size:13px;color:var(--tx3);}
.signpad{width:100%;height:150px;border:1px dashed var(--line2);border-radius:12px;background:var(--bg-sub);touch-action:none;display:block;}

/* 탭바 */
.tabbar{flex-shrink:0;border-top:1px solid var(--line);display:flex;padding:8px 6px 18px;background:#fff;position:relative;z-index:10;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);padding-top:4px;position:relative;}
.tab.on{color:var(--pri);}
.tab .lb{font-size:11px;font-weight:500;} .tab.on .lb{font-weight:700;}
.tab .bd{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* 채팅 */
.chatpage{height:100%;display:flex;flex-direction:column;background:#fff;}
.chead{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px 12px;border-bottom:1px solid var(--line);}
.chead .ct{font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.chead .cm{font-size:12px;color:var(--tx3);}
.chead .seg button{height:30px;padding:0 10px;font-size:12.5px;flex:none;}
.chatlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 20px;}
.chatlist::-webkit-scrollbar{width:0;}
.bub{max-width:80%;}
.bub .who{font-size:12px;color:var(--tx2);font-weight:600;margin:0 0 4px 2px;}
.bub .msg{font-size:14px;line-height:1.5;background:var(--bg-sub);border-radius:16px 16px 16px 4px;padding:10px 13px;}
.bub .tm{font-size:11px;color:var(--tx3);margin-top:4px;padding:0 2px;}
.bub.me{align-self:flex-end;}
.bub.me .msg{background:var(--pri);color:#fff;border-radius:16px 16px 4px 16px;}
.bub.me .tm{text-align:right;}
.cissue{align-self:stretch;border-left:3px solid var(--err);background:var(--err-weak);border-radius:4px 12px 12px 4px;padding:12px 14px;}
.cissue.done{border-left-color:var(--line2);background:var(--bg-sub);}
.ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.ci-b{font-size:12px;font-weight:700;color:var(--err);}

.ci-act{font-size:12px;font-weight:700;color:var(--err);height:26px;padding:0 10px;border-radius:13px;background:#fff;}
.ci-tx{font-size:14px;line-height:1.5;font-weight:600;}
.cissue.done .ci-tx{color:var(--tx2);}
.ci-ph{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--tx2);margin-top:6px;}
.cissue .ph{width:72px;height:72px;border-radius:8px;object-fit:cover;margin-top:8px;display:block;}
.ci-m{font-size:11.5px;color:var(--tx3);margin-top:6px;}
.chatbar{flex-shrink:0;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;}
.ibtn{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;flex-shrink:0;background:var(--err-weak);border-radius:20px;font-size:13px;font-weight:700;color:var(--err);}
.cfield{flex:1;min-width:0;height:40px;background:var(--bg-sub);border:0;border-radius:20px;padding:0 16px;font-size:14px;outline:none;}
.cfield:focus{box-shadow:0 0 0 2px var(--pri-line);}
.csend{width:40px;height:40px;border-radius:50%;background:var(--pri);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}

/* ===== v8 테마 · 박스 없이 타이포·여백·구분선으로 위계 · 클린 화이트 + 비비드 블루 1색 + 레드(문제만) ===== */
:root{
  --pri:#1F6BFF;--pri-h:#1557E6;--pri-weak:#EBF2FF;--pri-line:#C7DAFF;--sky:#8DB4FF;--navy:#191F28;
  --tx:#191F28;--tx2:#4E5968;--tx3:#8B95A1;--line:#EEF0F3;--line2:#E2E5EA;
  --bg:#FFFFFF;--canvas:#F4F5F7;--bg-sub:#F7F8FA;--hover:#F2F4F6;
  --ok:#1F6BFF;--ok-weak:#EBF2FF;--warn:#4E5968;--warn-weak:#F2F4F6;--err:#F04452;--err-weak:#FFEEEF;
  --card-sh:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.05);
}
body{color:var(--tx);}
.st{padding:3px 10px 3px 8px;border-radius:999px;background:#F2F4F6;color:var(--tx2);font-weight:600;line-height:1.45;}
.st::before{background:currentColor;}
.st.pri,.st.ok{background:var(--pri-weak);color:var(--pri);}
.st.warn{background:#F2F4F6;color:var(--tx);}
.st.err{background:var(--err-weak);color:var(--err);}
.st.off,.st.mute{background:#F2F4F6;color:var(--tx3);}
.callout{background:var(--bg-sub);color:var(--tx2);}
.callout.ok,.callout.ok b,.callout.pri,.callout.pri b{background:var(--pri-weak);color:var(--pri);}
.callout.warn,.callout.warn b{background:#F2F4F6;color:var(--tx);}
.callout.err,.callout.err b{background:var(--err-weak);color:var(--err);}
.btn.pri,.btn:not(.ghost):not(.soft):not(.sm):not(.xs){}

/* 모바일: 흰 화면 · 박스 없음 · 섹션 사이 회색 띠(앱 표준 구분) */
.frame,.statusbar,.main,.page{background:#fff;}
.tabbar{background:#fff;border-top:1px solid var(--line);}
.top .job,.job .nm{color:var(--tx);font-weight:700;}
.hero{margin-top:18px;}
.hero .hi{color:var(--tx2);font-weight:500;}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-0.035em;color:var(--tx);}
.hero .big em{color:var(--pri);}
.hero .big small{color:var(--tx3);}
.pbar{height:8px;background:#EEF0F3;border-radius:4px;}
.pbar i{background:var(--pri);border-radius:4px;}
.facts{border-top:0;border-bottom:0;padding:18px 0 4px;}
.fact span{color:var(--tx2);font-weight:500;}
.fact b{font-size:18px;font-weight:800;color:var(--tx);white-space:nowrap;}
.fact+.fact{border-left-color:var(--line2);}
.fact.err b,.fact.alert b{color:var(--err);}
.fact.warn b{color:var(--tx);}
.sec,.card{background:transparent;border-radius:0;margin:26px -20px 0;padding:24px 20px 4px;border-top:10px solid #F2F4F6;box-shadow:none;}
.sec-h{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px;}
.sess,.iss,.res,.idchk,.profile{box-shadow:none;}
.sess{background:transparent;padding:0;border-radius:0;margin-top:14px;}
.sess-h .tm{font-size:17px;}
.iss{background:transparent;border-radius:0;margin:0;padding:14px 0;border-bottom:1px solid var(--line);}
.iss.open{box-shadow:none;padding-left:12px;border-left:3px solid var(--err);}
.res{background:transparent;padding:18px 0 10px;}
.idchk{background:var(--bg-sub);border:0;}
.idchk.on{background:var(--pri-weak);}
.profile{background:transparent;padding:4px 0 18px;border-bottom:1px solid var(--line);border-radius:0;}
.nowstrip{padding:0 20px;}
.search{background:var(--bg-sub);}
.seg{background:#EEF0F3;}
.tools .search{min-width:0;}
.qrbtn{background:var(--pri);}
.block{background:var(--bg-sub);}
.callout{border-radius:12px;}
.titem.late .tm{color:var(--err);}
.prow:hover{background:var(--bg-sub);}


.olog{padding:20px 24px 28px;}

.cd-row{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;padding:10px 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:none;}

svg.i.ph{fill:currentColor;stroke:none;}

.olog{display:flex;flex-direction:column;}
.olog>*{flex-shrink:0;}

/* ===== BETA ===== */

}

/* 로컬 모드: 로그인 없이 시작 · 온라인 모드: 서버 계정으로 로그인 (js/onsite-sb.js) */
if(LOCAL)S.auth={id:'local',name:'운영자',role:'접수'};
/* 시간표 링크(#tt=…)로 접속: 링크에 담긴 시간표를 이 기기에 저장 (로컬 모드)
   초대 링크(#inv=…)는 무시해요 · 운영자 계정은 온라인 모드에서만 써요 · 링크의 # 뒤는 서버로 보내지지 않아요 */
async function processHash(){
  const h=location.hash||'';if(h.length<2)return false;
  history.replaceState(null,'',location.pathname+location.search);
  /* 온라인 모드 초대 링크(#id=KFI26-S01): 아이디만 미리 채워요 (비밀번호·지원자 정보는 링크에 없어요) */
  const idm=h.match(/[#&]id=([^&]+)/);
  if(idm&&!LOCAL){let v='';try{v=decodeURIComponent(idm[1]).trim();}catch(e){}
    if(/^[A-Za-z0-9-]{3,40}$/.test(v)){
      if(!S.auth){S.lgId=v.toUpperCase();S.inviteMsg='아이디가 입력됐어요 · 안내받은 임시 비밀번호로 로그인해 주세요';S.loginErr='';render();setTimeout(()=>{const el=$('#lg-pw');el&&el.focus();},0);}
      else if(v.toUpperCase()!==String(S.auth.id).toUpperCase()){S.switchTo=v.toUpperCase();dialog('다른 계정의 초대 링크예요',`지금 ${esc(S.auth.name)}(${esc(S.auth.id)}) 계정으로 로그인돼 있어요<br>로그아웃하고 ${esc(S.switchTo)} 로 로그인할까요?`,'로그아웃하고 바꾸기','switchAcc',false);}
    }
    return true;}
  const m=h.match(/[#&]tt=([\w-]+)/);if(!m||!LOCAL)return false;
  try{
    const o=await rosterFromToken(m[1]);
    if(!o||!Array.isArray(o.rows)||!o.rows.length)throw new Error('empty');
    dbSet('roster',{v:o.v,file:o.file,labels:o.labels,rows:o.rows,at:stamp(),by:'시간표 링크'});
    addLog(who(),`시간표 링크로 시간표 받음 · ${o.rows.length}명`);
    S.sheet=null;S.q='';S.room='all';if(S.tab==='my')S.tab='board';
    render();toast('최신 시간표를 받았어요');
  }catch(e){console.warn('시간표 링크 읽기 실패',e);toast(e&&e.message==='old-browser'?'이 브라우저에서는 시간표 링크를 열 수 없어요 · 최신 브라우저로 열어 주세요':'시간표 링크가 올바르지 않아요 · 채용 담당자에게 다시 받아 주세요',true);}
  return true;
}
window.addEventListener('hashchange',()=>{processHash();});
const who=()=>`${S.auth?S.auth.name:'운영'} · ${S.auth&&S.auth.role==='마스터'?'마스터':'운영관리자'}`;

/* ===== 운영보드 ===== */
function pgBoard(){
  const now=nowMin();
  const late=lateConduct(now),soon=soonConduct(now);
  const [sl,st]=syncLabel();
  const top=`
  <div class="appbar">${SYM}<span class="beta">BETA</span><button class="iconbtn ml mr-8" data-act="noti" aria-label="알림">${ic('bell','s22')}${late.length+soon.length?`<span class="nd">${late.length+soon.length}</span>`:''}</button></div>
  <div class="job"><div class="nm">${esc(J.name)}</div><div class="dayline" style="margin-top:4px"><span class="syncdot ${st}">${sl}</span></div></div>
  ${isEventDay()?'':`<div class="callout" style="margin:12px 0 0">${ic('info','s14')}<span>면접일(${DATE_LABEL}) 전 테스트 중이에요 · 시각은 이 기기 시계 기준</span></div>`}`;
  if(!J.ready)return top+emptyRoster();
  const all=R();const n=s=>all.filter(r=>A(r.no).status===s).length;
  const act=all.filter(r=>A(r.no).status!=='불참').length;const rec=n('접수');
  const pct=act?Math.round(rec/act*100):0;
  const rooms=J.sched.rooms.map(rm=>{const tl=sessions(rm,true);const cur=tl.find(x=>x.s<=now&&x.e>now);const nx=tl.find(x=>x.s>now);const d=roomDelay(rm);
    const chip=d>0?`<span class="st err">+${d}분</span>`:d<0?`<span class="st pri">${d}분</span>`:'<span class="st ok">정시</span>';
    const line=cur?`${esc(cur.label)} 진행 · ~${HM(cur.e)}`:nx?`${esc(nx.label)} · ${HM(nx.s)} 입실`:'모든 조 종료';
    return `<div class="bd-room"><div class="h"><b>${esc(rm.name)}</b>${chip}</div><div class="s">${line}</div>
      <div class="dash">${tl.map(x=>`<i class="${x.e<=now?'d':x.s<=now?'c':''}"></i>`).join('')}</div></div>`;}).join('');
  const upc=[];J.sched.rooms.forEach(rm=>sessions(rm,true).forEach(x=>{if(x.s>now)upc.push(x);}));upc.sort((a,b)=>a.s-b.s);
  const nxt=[];for(const x of upc){for(const no of x.members){if(A(no).status!=='불참')nxt.push({no,x});}if(nxt.length>=3)break;}
  const nextRows=nxt.slice(0,3).map(({no,x})=>{const a=A(no),pp=P(no);const ino=INO(no);const d=(String(ino).match(/(\d+)\D*$/)||['',''])[1];const num=d?String(+d):'';
    return `<button class="bd-nx" data-act="open" data-no="${esc(no)}"><span class="n">${num}</span><span class="w"><b>${esc(ino)} <em>${esc(pp.name)}</em></b><span>${esc(J.arrive[no])} 도착${CONFIG.useDevice&&a.device?` · 기기 ${esc(a.device)}번`:''} · ${esc(x.label)} ${HM(x.s)}</span></span><span class="st ${statusCls(a.status)}">${esc(a.status||'미접수')}</span></button>`;}).join('');
  return top+`
  <div class="hero"><div class="big">접수 <em>${pct}%</em><small>${rec} / ${act}명</small></div><div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="facts"><div class="fact"><span>접수예정·공란</span><b>${n('접수예정')+n('')}</b></div><div class="fact ${n('연락중')?'err':''}"><span>연락중</span><b>${n('연락중')}</b></div><div class="fact"><span>불참</span><b>${n('불참')}</b></div><div class="fact ${late.length?'err':''}"><span>할 일 지남</span><b>${late.length}</b></div></div></div>
  ${late.length?`<button class="cd-row" data-act="tab" data-t="conduct"><span class="st err">행동 강령 미완료 ${late.length}건${ic('chev','s14')}</span></button>`:''}
  <div class="bd-sec"><h3>면접실 현황</h3><span>${HM(now)} 기준</span></div>
  <div class="bd-rooms">${rooms}</div>
  <div class="bd-sec"><h3>다음 입실</h3><button data-act="tab" data-t="list">전체 명단${ic('chev','s14')}</button></div>
  ${nextRows?`<div class="bd-next">${nextRows}</div>`:`<div class="bd-empty">오늘 남은 입실이 없어요</div>`}
  `;
}

function sessRows(list,showRoom){
  const now=nowMin();const q=S.q.trim();
  return list.map(o=>{
    if(o.x.kind==='gap'){if(q)return '';return `<div class="block gap"><span>${showRoom?esc(o.room.name)+' · ':''}빈 시간 (점심·휴식)</span><b>${HM(o.x.s)}–${HM(o.x.e)}</b></div>`;}
    const x=o.x;const mem=x.members.filter(no=>{if(!q)return true;const pp=P(no);return (pp.name+no+INO(no)).includes(q);});
    if(!mem.length)return '';
    const shift=x.shift;const isNow=x.s<=now&&x.e>now,done=x.e<=now;
    return `<div class="sess ${isNow?'now':''} ${done?'done':''}"><div class="sess-h"><span class="tm">${HM(x.s)}${shift>0?`<span class="dly">+${shift}</span>`:shift<0?`<span class="shr">${shift}</span>`:''}</span><span class="lb">${showRoom?esc(o.room.name)+' · ':''}${esc(x.label)} · ${x.attend}/${x.members.length}명 · ${x.len}분${!done?` · 대기 ${HM(x.s-10)}`:''}</span>${x.len!==x.planLen?'<span class="rc">재산정</span>':''}${isNow?'<span class="nowtag">진행 중</span>':''}</div>
      ${mem.map(no=>{const a=A(no),pp=P(no);return `<div class="prow ${a.status==='불참'?'absent':''}" data-act="open" data-no="${esc(no)}"><span class="no">${esc(J.arrive[no])}</span><div class="who"><div class="l1">${esc(INO(no))}<span>${esc(pp.name)}</span></div><div class="l2">${esc(no)}${CONFIG.useDevice&&a.device?` · 기기 ${esc(a.device)}`:''}${a.inR?' · 입실':''}${a.outR?' · 퇴실':''}${a.delay?` · <i>DELAY +${a.delay}</i>`:''}${a.note?` · ${esc(a.note)}`:''}</div></div><span class="st ${statusCls(a.status)}">${esc(stLabel(a.status))}</span></div>`;}).join('')}</div>`;
  }).join('');
}
function boardList(){
  let list=[];
  if(S.room==='all'){J.sched.rooms.forEach((rm,ri)=>{timeline(rm,true).forEach(x=>list.push({x,room:rm,ri}));});list.sort((a,b)=>a.x.s-b.x.s||a.ri-b.ri);}
  else{const rm=J.sched.rooms[S.room];if(!rm)return `<div class="empty">면접실을 다시 골라 주세요</div>`;list=timeline(rm,true).map(x=>({x,room:rm,ri:S.room}));}
  const h=sessRows(list,S.room==='all');
  return h.trim()?h:`<div class="empty">검색 결과 없음</div>`;
}

/* ===== 행동 강령 ===== */
function pgConduct(){
  if(!J.ready)return `<div class="ttl">행동 강령</div>`+emptyRoster();
  const now=nowMin();
  const list=conductList().filter(c=>S.cdFilter==='전체'||c.who===S.cdFilter);
  const open=list.filter(c=>!c.done),fin=list.filter(c=>c.done);const late=open.filter(c=>T(c.t)<now);
  let nowPlaced=false;
  const row=c=>{const late=!c.done&&T(c.t)<now,soon=!c.done&&!late&&T(c.t)-now<=10;
    return `<div class="titem ${c.done?'fin':''} ${late?'late':''} ${soon?'soon':''}"><span class="tchk ${c.done?'on':''}" data-act="cd" data-id="${esc(c.id)}"></span><span class="tm">${esc(c.t)}</span><div class="bd"><div class="do">${esc(c.txt)}</div><div class="who">${esc(c.who)}${c.done&&c.at?` · ${esc(c.at)} 완료${c.by?` · ${esc(c.by)}`:''}`:''}</div></div>${c.done?'<span class="st">완료</span>':late?'<span class="st err">미완료</span>':soon?'<span class="st pri">곧</span>':'<span class="st">예정</span>'}</div>`;};
  return `<div class="ttl">행동 강령</div><div class="sub">시간에 맞춰 할 일을 알려드려요 · 체크하면 마스터 화면에도 표시돼요</div>
  <div class="sum"><div class="big">${late.length?`미완료 <em class="err">${late.length}건</em>`:`남은 일 <em>${open.length}건</em>`}</div><div class="pbar"><i style="width:${list.length?fin.length/list.length*100:0}%"></i></div></div>
  ${late.length?`<div class="callout err" style="margin-top:14px">${ic('alert','s14')}<span>시간이 지난 할 일이 있어요 · <b>마스터 화면에도 함께 표시돼요</b></span></div>`:''}
  <div class="chips" style="margin:16px 0 4px">${['전체'].concat(OP_ROLES).map(k=>`<button class="chip ${S.cdFilter===k?'on':''}" data-act="cdf" data-k="${k}">${k}</button>`).join('')}</div>
  <div class="card">${open.map(c=>{let pre='';if(!nowPlaced&&T(c.t)>=now){pre=`<div class="nowline">지금 ${HM(now)}</div>`;nowPlaced=true;}return pre+row(c);}).join('')}${!nowPlaced?`<div class="nowline">지금 ${HM(now)}</div>`:''}${!open.length?'<div class="empty">남은 할 일이 없어요</div>':''}</div>
  ${fin.length?`<div class="card"><div class="fhead" data-act="showDone" style="border:0;margin:0"><span>완료 ${fin.length}</span>${ic(S.showDone?'down':'chev','s14')}</div>${S.showDone?fin.map(row).join(''):''}</div>`:''}`;
}
function sheetNoti(){

/* ===== 기록 ===== */
function setStatus(no,v){
  const ap=A(no);const so=sessionOf(no);const before=so.x.len;const old=ap.status;
  const patch={status:v};let dev='';
  /* 전자기기 번호: 온라인이면 서버가 하나씩 배정(동시에 접수해도 겹치지 않음) · 로컬 모드나 연결이 안 되면 이 기기에서 다음 번호 */
  const needDev=v==='접수'&&CONFIG.useDevice&&!ap.device;
  const localNext=()=>String(Math.max(0,...R().map(r=>+A(r.no).device||0))+1);
  if(v==='접수'){if(!ap.ck)patch.ck={at:HM(nowMin()),how:'수동',by:S.auth.name};
    if(needDev&&LOCAL){patch.device=localNext();dev=patch.device;}}
  else patch.ck=null;
  if(v==='불참'){patch.inR=false;patch.device='';}
  setApp(no,patch,who(),`${INO(no)} ${P(no).name} 접수 상태 ${stLabel(old)} → ${stLabel(v)}`);
  const after=sessionOf(no).x.len;
  if(needDev&&!LOCAL){
    toast(`${INO(no)} ${stLabel(v)} · 전자기기 번호 받는 중…`);
    STORE.assignDevice(no).then(d=>{
      if(!d){d=localNext();setApp(no,{device:d},who(),`${INO(no)} 전자기기 ${d}번 (오프라인 배정)`);toast(`${INO(no)} 전자기기 ${d}번 · 연결이 안 돼 이 기기에서 배정했어요 · 겹치는지 확인해 주세요`,true);}
      else toast(`${INO(no)} ${stLabel(v)} · 전자기기 ${d}번`);
      render(true);
    });
  } else toast(v==='불참'&&before!==after?`불참 처리 · ${so.x.label} 면접시간 ${before}분 → ${after}분`:`${INO(no)} ${stLabel(v)}${dev?` · 전자기기 ${dev}번`:''}`);
  render(true);
}
function setDelay(no,v){
  const ap=A(no);const rm=sessionOf(no).room;
  setApp(no,{delay:v},who(),`${INO(no)} DELAY ${v}분`);
  const lastAfter=sessions(rm,true).pop().e;
  toast(`${INO(no)} 지연 ${v}분 · ${rm.name} 종료 예정 ${HM(lastAfter)}`);render(true);
}

/* ===== 로그인 · 비밀번호 (온라인 모드 · 계정은 서버에서 관리) ===== */
function setBusy(act,label){const b=document.querySelector(`[data-act="${act}"]`);if(b){b.disabled=true;b.textContent=label;}}
async function doLogin(){
  if(LOCAL||S.busy)return;
  if(STORE.fatal||!STORE.auth){S.loginErr=STORE.fatal||'온라인 모드 파일을 불러오지 못했어요 · 새로고침해 주세요';render();return;}
  const raw=$('#lg-id').value.trim(),pw=$('#lg-pw').value;const id=raw.includes('@')?raw.toLowerCase():raw.toUpperCase();S.lgId=id;
  if(!id||!pw){S.loginErr='아이디와 비밀번호를 입력해 주세요';render();return;}
  S.busy=true;setBusy('login','로그인 중…');
  let r;try{r=await STORE.auth.signIn(id,pw);}catch(e){r={ok:false,message:'로그인하지 못했어요 · 잠시 후 다시 시도해 주세요'};}finally{S.busy=false;}
  if(!r.ok){S.loginErr=r.message;render();return;}
  S.loginErr='';S.inviteMsg='';
  if(r.mustChange){S.change={id:r.me.id,old:pw};render();setTimeout(()=>{const el=$('#np1');el&&el.focus();},0);return;}
  await finishLogin(r.me,'로그인');
}
async function finishLogin(me,logTxt){
  S.auth=meToAuth(me);S.change=null;S.tab='board';setWM();
  await STORE.startSync();
  addLog(who(),logTxt);render();toast(`${S.auth.name} · ${S.auth.role} 담당으로 로그인`);
}
async function savePw(){
  if(LOCAL||S.busy||!S.change)return;
  const n=$('#np1').value,c=$('#np2').value;
  const err=pwRule(n,S.change.old);if(err){S.loginErr=err;render();return;}
  if(n!==c){S.loginErr='새 비밀번호가 서로 달라요';render();return;}
  S.busy=true;setBusy('pwSave','변경하는 중…');
  const r=await STORE.auth.changePassword(S.change.old,n);S.busy=false;
  if(!r.ok){S.loginErr=r.message;render();return;}
  S.loginErr='';await finishLogin(STORE.auth.me,'첫 로그인 · 비밀번호 변경');
}
async function changePw(){
  if(LOCAL||S.busy)return;
  const o=$('#op0').value,n=$('#op1').value,c=$('#op2').value;
  if(!o){S.pwErr='현재 비밀번호를 입력해 주세요';renderSheet();return;}
  const err=pwRule(n,o);if(err){S.pwErr=err==='처음 받은 비밀번호와 다르게 정해 주세요'?'현재 비밀번호와 다르게 정해 주세요':err;renderSheet();return;}
  if(n!==c){S.pwErr='새 비밀번호가 서로 달라요';renderSheet();return;}
  S.busy=true;const r=await STORE.auth.changePassword(o,n);S.busy=false;
  if(!r.ok){S.pwErr=r.message;renderSheet();return;}
  addLog(who(),'비밀번호 변경');S.sheet=null;render(true);toast('비밀번호를 바꿨어요');
}
/* 로그아웃: 대기 중인 기록을 먼저 보내요 · 끝내 못 보내면(오프라인) 확인 후에만 로그아웃 */
async function logout(force){
  if(S.busy)return;S.busy=true;const id=S.auth&&S.auth.id;
  if(!force){addLog(who(),'로그아웃');setBusy('logout','기록 보내는 중…');await STORE.flushWait(6000);}
  S.busy=false;
  if(!force&&STORE.pending){render(true);dialog('보내지 못한 기록이 있어요',`아직 서버로 보내지 못한 기록이 ${STORE.pending}건 있어요<br>인터넷 연결을 확인한 뒤 다시 로그아웃해 주세요<br>그래도 로그아웃하면 이 휴대폰에 남은 기록은 사라져요`,'그래도 로그아웃','logoutForce',true);return;}
  await STORE.auth.signOut(force?{discard:true}:undefined);S.auth=null;S.lgId=id&&!String(id).includes('@')?id:'';S.sheet=null;render();
}
/* 마스터가 역할·이름을 바꾸면 내 정보도 갱신 · 중지·삭제·재발급은 STORE.onKicked 로 로그아웃 */
onDB(()=>{if(LOCAL||!S.auth||!STORE.auth.me)return;const a=meToAuth(STORE.auth.me);if(a.role!==S.auth.role||a.name!==S.auth.name){S.auth=a;setWM();safeRender();}});
STORE.onKicked=msg=>{S.auth=null;S.change=null;S.sheet=null;S.loginErr=msg||'';render();toast(msg||'로그아웃됐어요',true);};
STORE.onNotice=msg=>toast(msg,true);

/* ===== 이벤트 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;const no=t.dataset.no;
  switch(a){
    case 'login':doLogin();break;
    case 'pwSave':savePw();break;
    case 'pwCancel':if(!LOCAL)STORE.auth.signOut();S.change=null;S.loginErr='';render();break;
    case 'pwSheet':S.pwErr='';S.sheet={type:'pw'};renderSheet();break;
    case 'pwChange':changePw();break;
    case 'logout':if(!LOCAL)logout(false);break;
    case 'logoutForce':closeDlg();logout(true);break;
    case 'switchAcc':{closeDlg();const to=S.switchTo;S.switchTo=null;logout(false).then(()=>{if(!S.auth&&to){S.lgId=to;S.inviteMsg='아이디가 입력됐어요 · 안내받은 임시 비밀번호로 로그인해 주세요';render();}});break;}
    case 'dim':if(e.target===t){S.sheet=null;renderSheet();}break;
    case 'closeSheet':S.sheet=null;render(true);break;
    case 'dlgClose':closeDlg();break;
    case 'clock':shiftClock(+t.dataset.d);S.lastMin=nowMin();render(true);break;
    case 'tab':S.tab=t.dataset.t;S.sheet=null;render();break;
    case 'noti':S.sheet={type:'noti'};renderSheet();break;
    case 'room':S.room=t.dataset.i==='all'?'all':+t.dataset.i;render(true);break;
    case 'open':S.sheet={type:'app',no};renderSheet();break;
    case 'setSt':{const ap=A(no),v=t.dataset.v;if(ap.status===v)break;
      if(v==='불참'){dialog('불참 처리',`${esc(INO(no))} ${esc(P(no).name)}<br>불참으로 처리하면 해당 조 면접시간이 자동으로 줄어들어요`,'불참 처리','doAbsent',true,`data-no="${no}"`);break;}
      setStatus(no,v);break;}
    case 'doAbsent':closeDlg();setStatus(no,'불참');break;
    case 'tgl':{const ap=A(no),k=t.dataset.k;const v=!ap[k];const lb={inR:'입실',outR:'퇴실',fee:'면접비'}[k];
      setApp(no,{[k]:v},who(),`${INO(no)} ${lb} ${v?'체크':'해제'}`);
      if(k==='outR'&&v&&CONFIG.useDevice&&ap.device)toast(`퇴실 · 전자기기 ${ap.device}번 반환 확인`);render(true);break;}
    case 'dly':{const ap=A(no);setDelay(no,Math.max(0,(+ap.delay||0)+ +t.dataset.d));break;}
    case 'cd':{const id=t.dataset.id;const c=conductList().find(x=>x.id===id);if(!c)break;
      dbSet('conduct/'+id,c.done?null:{done:true,at:HM(nowMin()),by:S.auth.name});addLog(who(),`행동 강령 ${c.done?'완료 취소':'완료'} · ${c.t} ${c.txt}`);render(true);break;}
    case 'cdf':S.cdFilter=t.dataset.k;render(true);break;
    case 'showDone':S.showDone=!S.showDone;render(true);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const id=e.target.id;
  if(['lg-id','lg-pw'].includes(id)){e.preventDefault();doLogin();}else if(['np1','np2'].includes(id)){e.preventDefault();savePw();}else if(['op0','op1','op2'].includes(id)){e.preventDefault();changePw();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.inp==='q'){const pos=t.selectionStart;S.q=t.value;render(true);const el=document.querySelector('[data-inp="q"]');if(el){el.focus();el.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f&&S.auth){const no=t.dataset.no,ap=A(no);
    if(t.dataset.f==='delay'){setDelay(no,Math.max(0,+t.value||0));return;}
    const v=t.value.trim();if(v===ap[t.dataset.f])return;
    setApp(no,{[t.dataset.f]:v},who(),t.dataset.f==='device'?`${INO(no)} 전자기기 ${v?v+'번':'번호 삭제'}`:`${INO(no)} 비고 · ${v||'삭제'}`);
    if(t.dataset.f==='device'&&v)toast(`전자기기 보관번호 ${v}번`);render(true);}
});

/* 캡처 방지 (운영관리자 화면 필수) */
function setWM(){const nm=esc(S.auth?S.auth.name:'운영관리자');const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='120'><text x='6' y='76' transform='rotate(-22 110 60)' font-family='sans-serif' font-size='11' fill='rgba(15,30,69,0.05)'>${nm} · 운영관리자 · ONSITE BETA</text></svg>`;document.documentElement.style.setProperty('--wm',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);}
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('shield',document.hidden));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.secure')){e.preventDefault();toast('개인정보 보호를 위해 저장할 수 없어요',true);}});

async function boot(){
  setWM();
  if(LOCAL){render();processHash();return;}
  render();
  if(!STORE.fatal&&typeof STORE.boot!=='function')STORE.fatal='온라인 모드 파일을 불러오지 못했어요 · 인터넷 연결을 확인한 뒤 새로고침해 주세요';
  if(STORE.fatal){S.booting=false;S.loginErr=STORE.fatal;render();processHash();return;}
  const r=await STORE.boot();S.booting=false;
  if(r.authed){S.auth=meToAuth(r.me);setWM();}else if(r.error)S.loginErr=r.error;
  render();processHash();
}
boot();
</script>
